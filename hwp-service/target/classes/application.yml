server:
  port: 8081
  tomcat:
    max-swallow-size: 52428800  # 50MB

spring:
  application:
    name: hwp-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 52MB  # Security: Slightly larger to account for headers
      file-size-threshold: 2MB  # Write to disk after 2MB
  main:
    banner-mode: off
    allow-bean-definition-overriding: true

logging:
  level:
    root: WARN  # Security: Reduce verbosity in production
    com.chatbot.hwp: INFO  # Security: Changed from DEBUG to INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/hwp-service.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /management  # Security: Hide from default /actuator path
  endpoint:
    health:
      show-details: when-authorized  # Security: Only show details to authorized users
      show-components: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    display-request-duration: true
    operations-sorter: method
