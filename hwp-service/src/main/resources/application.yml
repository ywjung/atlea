server:
  port: 8081
  tomcat:
    max-swallow-size: 52428800  # 50MB

spring:
  application:
    name: hwp-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  main:
    banner-mode: off
    allow-bean-definition-overriding: true

logging:
  level:
    root: INFO
    com.chatbot.hwp: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    display-request-duration: true
    operations-sorter: method
