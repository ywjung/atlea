services:
  # Nginx reverse proxy with SSL termination
  nginx:
    image: nginx:1.25-alpine
    container_name: chatbot_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Document Service (Java Spring Boot for multi-format document extraction)
  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    image: chatbot-document-service:latest
    container_name: chatbot_document_service
    ports:
      - "127.0.0.1:8081:8081"  # API port
      - "127.0.0.1:8082:8082"  # Management/metrics port
    environment:
      - SPRING_PROFILES_ACTIVE=production
      # JVM options configured in Dockerfile for optimal performance
      # -Xms512m -Xmx2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2.5G
        reservations:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/document/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Application server (multiple replicas for load balancing)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_USER: appuser
        APP_UID: 1000
        APP_GID: 1000
    image: chatbot-app:latest
    container_name: chatbot_app_1
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DOCUMENT_SERVICE_URL=http://document-service:8081
      - HWP_SERVICE_URL=http://document-service:8081
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      - LLM_MODEL=${LLM_MODEL:-mlx-community/Qwen3-30B-A3B-4bit}
      - MODEL_DIR=/app/model
      - DATA_DIR=/app/data
      - CHUNK_SIZE=${CHUNK_SIZE:-512}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-50}
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=${WORKERS:-1}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - app_data:/app/data
      - app_models:/app/model
      - app_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      document-service:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis with persistence and authentication
  redis:
    image: redis:7-alpine
    container_name: chatbot_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - redis_logs:/var/log/redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Redis monitoring (optional, for development/staging)
  redis-insight:
    image: redis/redisinsight:latest
    container_name: chatbot_redis_insight
    ports:
      - "127.0.0.1:8001:5540"
    volumes:
      - redis_insight:/data
    depends_on:
      - redis
    restart: unless-stopped
    profiles:
      - monitoring

  # Prometheus for metrics collection (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: chatbot_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: chatbot_grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  # Application volumes
  app_data:
    driver: local
  app_models:
    driver: local
  app_logs:
    driver: local

  # Redis volumes
  redis_data:
    driver: local
  redis_logs:
    driver: local
  redis_insight:
    driver: local

  # Nginx volumes
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local

  # Monitoring volumes
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
