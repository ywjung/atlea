# 완전 통합 Docker Compose 설정
# RAG 챗봇 시스템의 모든 구성 요소를 포함
# 사용법: docker compose -f docker-compose.full.yml up -d

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rag_chatbot_postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      - POSTGRES_DB=chatbot
      - POSTGRES_USER=chatbot_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chatbot_secret}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - chatbot-network

  # Java 문서 처리 서비스
  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: rag_chatbot_document_service
    ports:
      - "8081:8081"      # API 포트
      - "8082:8082"      # 관리/메트릭 포트
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JVM_OPTS=-Xms512m -Xmx2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/document/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - chatbot-network

  # ClamAV 바이러스 스캔 서비스
  clamav:
    image: clamav/clamav:latest
    platform: linux/amd64
    container_name: rag_chatbot_clamav
    ports:
      - "3310:3310"      # ClamAV daemon 포트
    volumes:
      - clamav_data:/var/lib/clamav
    environment:
      - CLAMAV_NO_FRESHCLAM=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "clamdscan --ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - chatbot-network

  # Python RAG 챗봇 애플리케이션
  chatbot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_chatbot_app
    ports:
      - "${PORT:-8085}:${PORT:-8085}"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Docker 내부 서비스 연결 (env_file 값을 오버라이드)
      - DOCUMENT_SERVICE_URL=http://document-service:8081
      - HWP_SERVICE_URL=http://document-service:8081
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DATABASE_URL=postgresql+asyncpg://chatbot_user:${POSTGRES_PASSWORD:-chatbot_secret}@postgres:5432/chatbot
    volumes:
      - ./data:/app/data
      - ./model:/app/model
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      document-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-8085}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - chatbot-network

volumes:
  postgres_data:
    driver: local
  clamav_data:
    driver: local

networks:
  chatbot-network:
    driver: bridge
