<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#2563eb"/>

  <!-- Document icon -->
  <rect x="30" y="25" width="30" height="40" fill="white" rx="2"/>
  <line x1="35" y1="32" x2="55" y2="32" stroke="#2563eb" stroke-width="2"/>
  <line x1="35" y1="40" x2="55" y2="40" stroke="#2563eb" stroke-width="2"/>
  <line x1="35" y1="48" x2="50" y2="48" stroke="#2563eb" stroke-width="2"/>

  <!-- Chat bubble -->
  <circle cx="65" cy="55" r="12" fill="#10b981"/>
