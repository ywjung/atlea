<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 관리 - AI 챗봇</title>
    <link rel="stylesheet" href="/static/auth.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <!-- Logger System -->
    <script src="/static/env-config.js?v=1"></script>
    <script src="/static/logger.js?v=1"></script>
</head>
<body>
    <div class="profile-container">
        <a href="/" class="back-link">메인으로 돌아가기</a>

        <div class="auth-header">
            <h1>프로필 관리</h1>
            <p>계정 정보를 관리하고 보안 설정을 변경할 수 있습니다</p>
        </div>

        <!-- 사용자 정보 카드 -->
        <div class="card">
            <div class="card-header">사용자 정보</div>
            <div class="card-body">
                <div class="user-info" id="userInfo">
                    <div class="loading">사용자 정보 로딩 중</div>
                </div>
            </div>
        </div>

        <!-- 프로필 수정 카드 -->
        <div class="card">
            <div class="card-header">프로필 수정</div>
            <div class="card-body">
                <div id="profile-error" class="message error-message"></div>
                <div id="profile-success" class="message success-message"></div>

                <form id="profileForm" class="auth-form">
                    <div class="form-group">
                        <label for="username">사용자명</label>
                        <input
                            type="text"
                            id="username"
                            class="form-input"
                            minlength="2"
                            maxlength="50"
                            placeholder="새 사용자명"
                        >
                        <small style="color: #666;">영문, 숫자, 한글, 언더스코어(_)만 사용 가능</small>
                    </div>

                    <button type="submit" class="btn btn-primary" id="updateProfileBtn">
                        프로필 업데이트
                    </button>
                </form>
            </div>
        </div>

        <!-- 비밀번호 변경 카드 -->
        <div class="card">
            <div class="card-header">비밀번호 변경</div>
            <div class="card-body">
                <div id="password-error" class="message error-message"></div>
                <div id="password-success" class="message success-message"></div>

                <form id="passwordForm" class="auth-form">
                    <div class="form-group">
                        <label for="oldPassword">현재 비밀번호</label>
                        <input
                            type="password"
                            id="oldPassword"
                            class="form-input"
                            placeholder="현재 비밀번호"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="newPassword">새 비밀번호</label>
                        <input
                            type="password"
                            id="newPassword"
                            class="form-input"
                            placeholder="새 비밀번호"
                            required
                        >
                        <div id="passwordRequirements" class="password-requirements">
                            <strong>비밀번호 요구사항:</strong>
                            <ul>
                                <li id="req-length" class="invalid">✗ 최소 8자 이상</li>
                                <li id="req-uppercase" class="invalid">✗ 대문자 1개 이상</li>
                                <li id="req-lowercase" class="invalid">✗ 소문자 1개 이상</li>
                                <li id="req-digit" class="invalid">✗ 숫자 1개 이상</li>
                                <li id="req-special" class="invalid">✗ 특수문자 1개 이상</li>
                                <li id="req-nospace" class="invalid">✗ 공백 없음</li>
                            </ul>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">새 비밀번호 확인</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-input"
                            placeholder="새 비밀번호 다시 입력"
                            required
                        >
                    </div>

                    <div class="info-message" style="display: block; margin-top: 10px;">
                        ⚠️ 비밀번호 변경 시 모든 세션에서 로그아웃됩니다.
                    </div>

                    <button type="submit" class="btn btn-danger" id="changePasswordBtn">
                        비밀번호 변경
                    </button>
                </form>
            </div>
        </div>

        <!-- 세션 관리 카드 -->
        <div class="card">
            <div class="card-header">
                활성 세션
                <div style="float: right; display: flex; gap: 8px;">
                    <button class="btn btn-danger" id="revokeAllSessionsBtn" style="padding: 8px 16px; font-size: 14px;">
                        모든 세션 종료
                    </button>
                    <button class="btn btn-secondary" id="refreshSessionsBtn" style="padding: 8px 16px; font-size: 14px;">
                        새로고침
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div id="sessions-error" class="message error-message"></div>
                <div id="sessions-success" class="message success-message"></div>

                <div class="info-message" style="display: block; margin-bottom: 15px;">
                    ⚠️ 모든 세션을 종료하면 자동으로 로그아웃됩니다.
                </div>

                <div id="sessionsList" class="sessions-list">
                    <div class="loading">세션 정보 로딩 중</div>
                </div>
            </div>
        </div>

        <!-- 로그아웃 -->
        <div class="btn-group">
            <button class="btn btn-danger btn-block" id="logoutBtn">
                로그아웃
            </button>
        </div>
    </div>

    <script src="/static/auth.js"></script>
    <script>
        // 페이지 로드 완료 후 실행
        document.addEventListener('DOMContentLoaded', async function() {
            // 먼저 로컬 인증 체크 (빠른 리다이렉트)
            if (!Auth.requireAuth()) {
                return; // requireAuth가 이미 리다이렉트 처리함
            }

            // 서버에서 실제 세션 유효성 확인
            const isValid = await Auth.validateSession();
            if (!isValid) {
                return; // validateSession이 이미 리다이렉트 처리함
            }

            // 활동 모니터링 초기화 (자동 로그아웃)
            Auth.initActivityMonitor();

            // 세션 유효성 검증 초기화 (주기적 세션 체크)
            Auth.startSessionValidation();

            const user = Auth.getUser();
            const profileForm = document.getElementById('profileForm');
            const passwordForm = document.getElementById('passwordForm');
            const usernameInput = document.getElementById('username');
            const oldPasswordInput = document.getElementById('oldPassword');
            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const newPassword = document.getElementById('newPassword');

        // 사용자 정보 표시
        function displayUserInfo() {
            const user = Auth.getUser();
            const userInfoDiv = document.getElementById('userInfo');

            const createdAt = new Date(user.created_at).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
            const lastLogin = user.last_login ? new Date(user.last_login).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }) : '없음';

            userInfoDiv.innerHTML = `
                <div class="user-info-label">사용자 ID</div>
                <div class="user-info-value">${user.user_id}</div>
                <div class="user-info-label">이메일</div>
                <div class="user-info-value">${user.email}</div>
                <div class="user-info-label">사용자명</div>
                <div class="user-info-value">${user.username}</div>
                <div class="user-info-label">가입일</div>
                <div class="user-info-value">${createdAt}</div>
                <div class="user-info-label">마지막 로그인</div>
                <div class="user-info-value">${lastLogin}</div>
                <div class="user-info-label">계정 상태</div>
                <div class="user-info-value">${user.is_active ? '활성' : '비활성'}</div>
                <div class="user-info-label">역할</div>
                <div class="user-info-value">${user.role === 'admin' ? '관리자' : '일반 사용자'}</div>
            `;

            usernameInput.placeholder = user.username;
        }

        // 세션 목록 표시
        async function loadSessions() {
            try {
                const data = await Auth.getSessions();
                const sessionsDiv = document.getElementById('sessionsList');

                if (data.sessions.length === 0) {
                    // 활성 세션이 없으면 즉시 로그아웃 처리
                    logger.warn('⚠️ 활성 세션 없음 - 자동 로그아웃 처리');

                    // 스토리지 정리
                    Auth.clearAuth();
                    sessionStorage.clear();

                    // 경고 메시지 표시
                    sessionsDiv.innerHTML = `
                        <div style="background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 16px; margin-bottom: 16px;">
                            <p style="margin: 0; color: #856404;">
                                ⚠️ 활성 세션이 없습니다. 보안을 위해 자동으로 로그아웃됩니다.
                            </p>
                        </div>
                    `;

                    // 1초 후 로그인 페이지로 리다이렉트
                    setTimeout(() => {
                        window.location.href = '/static/login.html?message=' +
                            encodeURIComponent('세션이 만료되었습니다. 다시 로그인해주세요.');
                    }, 1000);
                    return;
                }

                sessionsDiv.innerHTML = data.sessions.map(session => {
                    const createdAt = new Date(session.created_at).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
                    const expiresAt = new Date(session.expires_at).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
                    const isCurrent = session.session_id === sessionStorage.getItem('current_session_id');

                    return `
                        <div class="session-item ${isCurrent ? 'current' : ''}">
                            <div class="session-info">
                                ${isCurrent ? '<span class="session-badge">현재 세션</span>' : ''}
                                <div class="session-info-row">
                                    <strong>IP 주소:</strong> ${session.ip_address || '알 수 없음'}
                                </div>
                                <div class="session-info-row">
                                    <strong>User Agent:</strong> ${session.user_agent || '알 수 없음'}
                                </div>
                                <div class="session-info-row">
                                    <strong>생성 시간:</strong> ${createdAt}
                                </div>
                                <div class="session-info-row">
                                    <strong>만료 시간:</strong> ${expiresAt}
                                </div>
                            </div>
                            <button class="btn btn-danger" onclick="revokeSession('${session.session_id}', ${isCurrent})">
                                ${isCurrent ? '현재 세션 종료' : '무효화'}
                            </button>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                logger.error('세션 정보 로드 실패:', error);

                // 인증 실패 시 자동 로그아웃
                if (error.message && (error.message.includes('401') || error.message.includes('Unauthorized') || error.message.includes('인증'))) {
                    logger.warn('⚠️ 인증 실패 - 자동 로그아웃 처리');

                    // 스토리지 정리
                    Auth.clearAuth();
                    sessionStorage.clear();

                    // 경고 메시지 표시
                    document.getElementById('sessionsList').innerHTML = `
                        <div style="background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 16px; margin-bottom: 16px;">
                            <p style="margin: 0; color: #856404;">
                                ⚠️ 인증이 만료되었습니다. 보안을 위해 자동으로 로그아웃됩니다.
                            </p>
                        </div>
                    `;

                    // 1초 후 로그인 페이지로 리다이렉트
                    setTimeout(() => {
                        window.location.href = '/static/login.html?message=' +
                            encodeURIComponent('세션이 만료되었습니다. 다시 로그인해주세요.');
                    }, 1000);
                } else {
                    // 기타 에러
                    document.getElementById('sessionsList').innerHTML =
                        '<p style="color: var(--danger-color);">세션 정보를 불러오는데 실패했습니다</p>';
                }
            }
        }

        // 세션 무효화
        async function revokeSession(sessionId, isCurrent) {
            const confirmMessage = isCurrent
                ? '현재 세션을 종료하면 자동으로 로그아웃됩니다. 계속하시겠습니까?'
                : '이 세션을 무효화하시겠습니까?';

            if (!confirm(confirmMessage)) return;

            try {
                await Auth.revokeSession(sessionId);

                if (isCurrent) {
                    // 현재 세션 무효화 - 즉시 로그아웃 처리
                    Auth.clearAuth();
                    sessionStorage.clear();

                    Auth.showSuccess('현재 세션이 종료되었습니다. 다시 로그인해주세요.', 'sessions-success');

                    // 1.5초 후 로그인 페이지로 이동
                    setTimeout(() => {
                        window.location.href = '/static/login.html?message=' +
                            encodeURIComponent('세션이 종료되었습니다. 다시 로그인해주세요.');
                    }, 1500);
                } else {
                    // 다른 세션 무효화 - 목록만 새로고침
                    Auth.showSuccess('세션이 무효화되었습니다', 'sessions-success');
                    setTimeout(() => Auth.hideSuccess('sessions-success'), 3000);
                    await loadSessions();
                }
            } catch (error) {
                Auth.showError('세션 무효화에 실패했습니다: ' + error.message, 'sessions-error');
            }
        }

        // 프로필 업데이트
        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            Auth.hideError('profile-error');
            Auth.hideSuccess('profile-success');

            const username = usernameInput.value.trim();

            if (!username) {
                Auth.showError('사용자명을 입력하세요', 'profile-error');
                return;
            }

            if (!/^[a-zA-Z0-9가-힣_]+$/.test(username)) {
                Auth.showError('사용자명은 영문, 숫자, 한글, 언더스코어만 사용할 수 있습니다', 'profile-error');
                return;
            }

            try {
                await Auth.updateProfile(username);
                Auth.showSuccess('프로필이 업데이트되었습니다', 'profile-success');
                displayUserInfo();
                usernameInput.value = '';
                setTimeout(() => Auth.hideSuccess('profile-success'), 3000);
            } catch (error) {
                Auth.showError('프로필 업데이트에 실패했습니다: ' + error.message, 'profile-error');
            }
        });

        // 비밀번호 실시간 검증
        newPasswordInput.addEventListener('input', () => {
            const password = newPasswordInput.value;
            updateRequirement('req-length', password.length >= 8);
            updateRequirement('req-uppercase', /[A-Z]/.test(password));
            updateRequirement('req-lowercase', /[a-z]/.test(password));
            updateRequirement('req-digit', /[0-9]/.test(password));
            updateRequirement('req-special', /[!@#$%^&*()_+\-=\[\]{}|;:',.<>?/~`]/.test(password));
            updateRequirement('req-nospace', !/\s/.test(password));
        });

        function updateRequirement(id, isValid) {
            const element = document.getElementById(id);
            if (isValid) {
                element.className = 'valid';
                element.textContent = '✓' + element.textContent.substring(1);
            } else {
                element.className = 'invalid';
                element.textContent = '✗' + element.textContent.substring(1);
            }
        }

        // 비밀번호 변경
        passwordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            Auth.hideError('password-error');
            Auth.hideSuccess('password-success');

            const oldPassword = oldPasswordInput.value;
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (newPassword !== confirmPassword) {
                Auth.showError('새 비밀번호가 일치하지 않습니다', 'password-error');
                return;
            }

            const validation = Auth.validatePassword(newPassword);
            if (!validation.valid) {
                Auth.showError('비밀번호가 요구사항을 충족하지 않습니다', 'password-error');
                return;
            }

            if (!confirm('비밀번호를 변경하면 모든 세션에서 로그아웃됩니다. 계속하시겠습니까?')) {
                return;
            }

            try {
                await Auth.changePassword(oldPassword, newPassword);
                Auth.showSuccess('비밀번호가 변경되었습니다. 다시 로그인해주세요.', 'password-success');

                setTimeout(() => {
                    Auth.clearAuth();
                    window.location.href = '/static/login.html?message=' +
                        encodeURIComponent('비밀번호가 변경되었습니다. 다시 로그인해주세요.');
                }, 2000);
            } catch (error) {
                Auth.showError('비밀번호 변경에 실패했습니다: ' + error.message, 'password-error');
            }
        });

        // 로그아웃
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            if (confirm('로그아웃하시겠습니까?')) {
                await Auth.logout();
            }
        });

        // 세션 새로고침
        document.getElementById('refreshSessionsBtn').addEventListener('click', loadSessions);

        // 모든 세션 종료
        document.getElementById('revokeAllSessionsBtn').addEventListener('click', async () => {
            if (!confirm('모든 세션을 종료하면 자동으로 로그아웃됩니다. 계속하시겠습니까?')) {
                return;
            }

            try {
                const result = await Auth.revokeAllSessions();

                // 즉시 로컬 스토리지와 세션 스토리지 정리
                Auth.clearAuth();
                sessionStorage.clear();

                // 성공 메시지 표시
                Auth.showSuccess(`모든 세션이 종료되었습니다 (${result.revoked_count}개)`, 'sessions-success');

                // 1.5초 후 로그인 페이지로 이동 (사용자가 메시지를 볼 시간)
                setTimeout(() => {
                    window.location.href = '/static/login.html?message=all_sessions_revoked';
                }, 1500);

            } catch (error) {
                Auth.showError('모든 세션 종료에 실패했습니다: ' + error.message, 'sessions-error');
            }
        });

            // 초기 로드
            displayUserInfo();
            loadSessions();

            // 전역 함수로 노출 (인라인 핸들러에서 사용)
            window.revokeSession = revokeSession;
        }); // DOMContentLoaded 이벤트 리스너 종료
    </script>
</body>
</html>
