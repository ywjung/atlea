<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 (OTP) - ATLEA</title>
    <link rel="stylesheet" href="/static/auth.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        .otp-input {
            text-align: center;
            letter-spacing: 8px;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .info-box {
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .info-box p {
            margin: 8px 0;
            font-size: 14px;
            color: #555;
        }

        .info-box strong {
            color: #333;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            gap: 8px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .step-number {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            background: #e0e0e0;
            color: #666;
        }

        .step-number.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .step-number.completed {
            background: #4CAF50;
            color: white;
        }

        .step-text {
            font-size: 13px;
            color: #666;
        }

        .step-text.active {
            color: #333;
            font-weight: 600;
        }

        .step-divider {
            width: 30px;
            height: 2px;
            background: #e0e0e0;
        }

        @media (max-width: 600px) {
            .step-text {
                display: none;
            }
        }
    </style>

    <!-- Logger System -->
    <script src="/static/env-config.js?v=1"></script>
    <script src="/static/logger.js?v=1"></script>

    <!-- DOMPurify for XSS protection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>

    <!-- Auth utilities -->
    <script src="/static/auth.js?v=1"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">🔐</div>
            <h1>비밀번호 재설정</h1>
            <p id="headerText">등록된 이메일 주소를 입력하세요</p>
        </div>

        <!-- 단계 표시기 -->
        <div class="step-indicator">
            <div class="step">
                <div class="step-number active" id="step1Number">1</div>
                <div class="step-text active" id="step1Text">이메일</div>
            </div>
            <div class="step-divider"></div>
            <div class="step">
                <div class="step-number" id="step2Number">2</div>
                <div class="step-text" id="step2Text">OTP 인증</div>
            </div>
            <div class="step-divider"></div>
            <div class="step">
                <div class="step-number" id="step3Number">3</div>
                <div class="step-text" id="step3Text">비밀번호</div>
            </div>
        </div>

        <div id="error-message" class="message error-message"></div>
        <div id="success-message" class="message success-message"></div>

        <!-- 1단계: 이메일 입력 -->
        <div id="step1Container">
            <form id="emailForm" class="auth-form">
                <div class="form-group">
                    <label for="email">
                        이메일 주소 <span class="required">*</span>
                    </label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="user@example.com"
                        required
                        autofocus
                        autocomplete="username"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="emailBtn">
                    다음
                </button>
            </form>
        </div>

        <!-- 2단계: OTP 입력 -->
        <div id="step2Container" style="display: none;">
            <div class="info-box">
                <p>📱 <strong>Google Authenticator</strong> 앱에서 6자리 코드를 확인하세요</p>
                <p>⏰ OTP 코드는 30초마다 자동으로 갱신됩니다</p>
            </div>

            <form id="otpForm" class="auth-form">
                <div class="form-group">
                    <label for="otpCode">
                        Google OTP 코드 (6자리) <span class="required">*</span>
                    </label>
                    <input
                        type="text"
                        id="otpCode"
                        class="form-input otp-input"
                        placeholder="000000"
                        maxlength="6"
                        pattern="[0-9]{6}"
                        required
                        autocomplete="off"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="otpBtn">
                    다음
                </button>

                <button type="button" class="btn btn-secondary btn-block" id="backToEmailBtn">
                    이전
                </button>
            </form>
        </div>

        <!-- 3단계: 비밀번호 재설정 -->
        <div id="step3Container" style="display: none;">
            <div class="info-box" style="background: #d4edda; border-left-color: #4CAF50;">
                <p>✅ OTP 인증이 완료되었습니다</p>
                <p>새로운 비밀번호를 설정하세요</p>
            </div>

            <form id="passwordForm" class="auth-form">
                <div class="form-group">
                    <label for="newPassword">
                        새 비밀번호 <span class="required">*</span>
                    </label>
                    <input
                        type="password"
                        id="newPassword"
                        class="form-input"
                        placeholder="새 비밀번호"
                        required
                        autocomplete="new-password"
                    >
                    <div id="passwordRequirements" class="password-requirements">
                        <strong>비밀번호 요구사항:</strong>
                        <ul>
                            <li id="req-length" class="invalid">✗ 최소 8자 이상</li>
                            <li id="req-uppercase" class="invalid">✗ 대문자 1개 이상</li>
                            <li id="req-lowercase" class="invalid">✗ 소문자 1개 이상</li>
                            <li id="req-digit" class="invalid">✗ 숫자 1개 이상</li>
                            <li id="req-special" class="invalid">✗ 특수문자 1개 이상</li>
                            <li id="req-nospace" class="invalid">✗ 공백 없음</li>
                        </ul>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        새 비밀번호 확인 <span class="required">*</span>
                    </label>
                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-input"
                        placeholder="새 비밀번호 다시 입력"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="passwordBtn">
                    비밀번호 재설정
                </button>

                <button type="button" class="btn btn-secondary btn-block" id="backToOtpBtn">
                    이전
                </button>
            </form>
        </div>

        <div class="auth-links">
            <a href="/static/login.html">로그인 페이지로 돌아가기</a>
            <a href="/static/register.html">계정이 없으신가요? 회원가입</a>
        </div>
    </div>

    <!-- ES6 Module: Compatibility Bridge for Auth -->
    <script type="module">
        // Import compatibility bridge (sets up window.Auth)
        import '/static/js/compat/auth-bridge.js';
    </script>
    <script>
        // 컨테이너
        const step1Container = document.getElementById('step1Container');
        const step2Container = document.getElementById('step2Container');
        const step3Container = document.getElementById('step3Container');

        // 폼
        const emailForm = document.getElementById('emailForm');
        const otpForm = document.getElementById('otpForm');
        const passwordForm = document.getElementById('passwordForm');

        // 입력 필드
        const emailInput = document.getElementById('email');
        const otpCodeInput = document.getElementById('otpCode');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        // 버튼
        const emailBtn = document.getElementById('emailBtn');
        const otpBtn = document.getElementById('otpBtn');
        const passwordBtn = document.getElementById('passwordBtn');
        const backToEmailBtn = document.getElementById('backToEmailBtn');
        const backToOtpBtn = document.getElementById('backToOtpBtn');

        // 단계 표시
        const step1Number = document.getElementById('step1Number');
        const step1Text = document.getElementById('step1Text');
        const step2Number = document.getElementById('step2Number');
        const step2Text = document.getElementById('step2Text');
        const step3Number = document.getElementById('step3Number');
        const step3Text = document.getElementById('step3Text');
        const headerText = document.getElementById('headerText');

        // 데이터 저장
        let userEmail = null;
        let resetToken = null;

        // OTP 입력 필드: 숫자만 입력 가능
        otpCodeInput.addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // 비밀번호 실시간 검증
        newPasswordInput.addEventListener('input', () => {
            const password = newPasswordInput.value;
            updateRequirement('req-length', password.length >= 8);
            updateRequirement('req-uppercase', /[A-Z]/.test(password));
            updateRequirement('req-lowercase', /[a-z]/.test(password));
            updateRequirement('req-digit', /[0-9]/.test(password));
            updateRequirement('req-special', /[!@#$%^&*()_+\-=\[\]{}|;:',.<>?/~`]/.test(password));
            updateRequirement('req-nospace', !/\s/.test(password));
        });

        function updateRequirement(id, isValid) {
            const element = document.getElementById(id);
            if (isValid) {
                element.className = 'valid';
                element.textContent = '✓' + element.textContent.substring(1);
            } else {
                element.className = 'invalid';
                element.textContent = '✗' + element.textContent.substring(1);
            }
        }

        // 1단계: 이메일 입력
        emailForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            Auth.hideError();
            Auth.hideSuccess();

            const email = emailInput.value.trim();

            if (!email) {
                Auth.showError('이메일 주소를 입력하세요');
                return;
            }

            // 이메일 형식 간단 검증
            if (!email.includes('@')) {
                Auth.showError('올바른 이메일 형식이 아닙니다');
                return;
            }

            // 이메일 저장 후 2단계로 이동
            userEmail = email;
            goToStep(2);
        });

        // 2단계: OTP 입력
        otpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            Auth.hideError();
            Auth.hideSuccess();

            const otpCode = otpCodeInput.value.trim();

            if (otpCode.length !== 6) {
                Auth.showError('OTP 코드는 6자리 숫자여야 합니다');
                return;
            }

            // 버튼 비활성화
            otpBtn.disabled = true;
            otpBtn.textContent = '인증 중...';

            try {
                const response = await fetch('/api/auth/verify-otp-for-reset', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: userEmail,
                        otp_code: otpCode
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // OTP 검증 성공
                    resetToken = data.reset_token;
                    Auth.showSuccess('✅ OTP 인증이 완료되었습니다');

                    setTimeout(() => {
                        Auth.hideSuccess();
                        goToStep(3);
                    }, 800);
                } else {
                    const errorMessage = data.detail || 'OTP 인증에 실패했습니다';

                    if (errorMessage.includes('OTP 코드가 일치하지 않습니다')) {
                        Auth.showError('OTP 코드가 일치하지 않습니다. Google Authenticator 앱에서 최신 코드를 확인하세요');
                    } else if (errorMessage.includes('찾을 수 없습니다')) {
                        Auth.showError('등록되지 않은 이메일입니다');
                    } else if (errorMessage.includes('OTP가 설정되지 않았습니다')) {
                        Auth.showError('해당 계정에 Google OTP가 설정되지 않았습니다. 관리자에게 문의하세요');
                    } else {
                        Auth.showError(errorMessage);
                    }

                    otpBtn.disabled = false;
                    otpBtn.textContent = '다음';
                }
            } catch (error) {
                logger.error('Error:', error);
                Auth.showError('서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요');
                otpBtn.disabled = false;
                otpBtn.textContent = '다음';
            }
        });

        // 3단계: 비밀번호 재설정
        passwordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            Auth.hideError();
            Auth.hideSuccess();

            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (newPassword !== confirmPassword) {
                Auth.showError('새 비밀번호가 일치하지 않습니다');
                return;
            }

            const validation = Auth.validatePassword(newPassword);
            if (!validation.valid) {
                Auth.showError('비밀번호가 요구사항을 충족하지 않습니다');
                return;
            }

            if (!resetToken) {
                Auth.showError('인증 토큰이 없습니다. 처음부터 다시 시작해주세요');
                return;
            }

            // 버튼 비활성화
            passwordBtn.disabled = true;
            passwordBtn.textContent = '처리 중...';

            try {
                const response = await fetch('/api/auth/confirm-password-reset-otp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        reset_token: resetToken,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    Auth.showSuccess('비밀번호가 성공적으로 변경되었습니다! 로그인 페이지로 이동합니다...');

                    setTimeout(() => {
                        window.location.href = '/static/login.html?message=' +
                            encodeURIComponent('비밀번호가 재설정되었습니다. 새 비밀번호로 로그인해주세요.');
                    }, 2000);
                } else {
                    const errorMessage = data.detail || '비밀번호 재설정에 실패했습니다';

                    if (errorMessage.includes('유효하지 않거나 만료된 토큰')) {
                        Auth.showError('인증 시간이 만료되었습니다. 처음부터 다시 시작해주세요');
                        setTimeout(() => {
                            resetToStep1();
                        }, 2000);
                    } else {
                        Auth.showError(errorMessage);
                    }

                    passwordBtn.disabled = false;
                    passwordBtn.textContent = '비밀번호 재설정';
                }
            } catch (error) {
                logger.error('Error:', error);
                Auth.showError('서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요');
                passwordBtn.disabled = false;
                passwordBtn.textContent = '비밀번호 재설정';
            }
        });

        // 이전 버튼들
        backToEmailBtn.addEventListener('click', () => {
            goToStep(1);
        });

        backToOtpBtn.addEventListener('click', () => {
            goToStep(2);
        });

        // 단계 이동 함수
        function goToStep(step) {
            Auth.hideError();
            Auth.hideSuccess();

            // 모든 컨테이너 숨기기
            step1Container.style.display = 'none';
            step2Container.style.display = 'none';
            step3Container.style.display = 'none';

            // 모든 단계 표시 초기화
            step1Number.classList.remove('active', 'completed');
            step1Text.classList.remove('active');
            step2Number.classList.remove('active', 'completed');
            step2Text.classList.remove('active');
            step3Number.classList.remove('active', 'completed');
            step3Text.classList.remove('active');

            // 해당 단계 표시
            if (step === 1) {
                step1Container.style.display = 'block';
                step1Number.classList.add('active');
                step1Text.classList.add('active');
                headerText.textContent = '등록된 이메일 주소를 입력하세요';
                emailInput.focus();
            } else if (step === 2) {
                step2Container.style.display = 'block';
                step1Number.classList.add('completed');
                step2Number.classList.add('active');
                step2Text.classList.add('active');
                headerText.textContent = 'Google OTP로 본인 인증을 진행하세요';
                otpCodeInput.value = '';
                otpCodeInput.focus();
                otpBtn.disabled = false;
                otpBtn.textContent = '다음';
            } else if (step === 3) {
                step3Container.style.display = 'block';
                step1Number.classList.add('completed');
                step2Number.classList.add('completed');
                step3Number.classList.add('active');
                step3Text.classList.add('active');
                headerText.textContent = '새로운 비밀번호를 설정하세요';
                newPasswordInput.focus();
            }
        }

        // 처음으로 돌아가기
        function resetToStep1() {
            userEmail = null;
            resetToken = null;
            emailInput.value = '';
            otpCodeInput.value = '';
            newPasswordInput.value = '';
            confirmPasswordInput.value = '';
            goToStep(1);
        }
    </script>
</body>
</html>
