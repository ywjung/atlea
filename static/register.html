<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - ATLEA</title>
    <link rel="stylesheet" href="/static/auth.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <!-- Logger System -->
    <script src="/static/env-config.js?v=1"></script>
    <script src="/static/logger.js?v=1"></script>

    <!-- DOMPurify for XSS protection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>

    <!-- Auth utilities -->
    <script src="/static/auth.js?v=1"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">🤖</div>
            <h1>회원가입</h1>
            <p>새로운 계정을 만들어 챗봇을 시작하세요</p>
        </div>

        <div id="error-message" class="message error-message"></div>
        <div id="success-message" class="message success-message"></div>

        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label for="email">
                    이메일 <span class="required">*</span>
                </label>
                <input
                    type="email"
                    id="email"
                    class="form-input"
                    placeholder="user@example.com"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="username">
                    사용자명 <span class="required">*</span>
                </label>
                <input
                    type="text"
                    id="username"
                    class="form-input"
                    placeholder="사용자명 (2-50자)"
                    required
                    minlength="2"
                    maxlength="50"
                >
                <small style="color: #666;">영문, 숫자, 한글, 언더스코어(_)만 사용 가능</small>
            </div>

            <div class="form-group">
                <label for="password">
                    비밀번호 <span class="required">*</span>
                </label>
                <input
                    type="password"
                    id="password"
                    class="form-input"
                    placeholder="비밀번호를 입력하세요"
                    required
                >
                <div id="passwordRequirements" class="password-requirements">
                    <strong>비밀번호 요구사항:</strong>
                    <ul>
                        <li id="req-length" class="invalid" data-text="최소 8자 이상">✗ 최소 8자 이상</li>
                        <li id="req-uppercase" class="invalid" data-text="대문자 1개 이상">✗ 대문자 1개 이상</li>
                        <li id="req-lowercase" class="invalid" data-text="소문자 1개 이상">✗ 소문자 1개 이상</li>
                        <li id="req-digit" class="invalid" data-text="숫자 1개 이상">✗ 숫자 1개 이상</li>
                        <li id="req-special" class="invalid" data-text="특수문자 1개 이상">✗ 특수문자 1개 이상</li>
                        <li id="req-nospace" class="invalid" data-text="공백 없음">✗ 공백 없음</li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    비밀번호 확인 <span class="required">*</span>
                </label>
                <input
                    type="password"
                    id="confirmPassword"
                    class="form-input"
                    placeholder="비밀번호를 다시 입력하세요"
                    required
                >
            </div>

            <!-- CAPTCHA 영역 -->
            <div id="captchaContainer" class="form-group" style="display: none;">
                <label for="captchaAnswer">보안 확인 <span class="required">*</span></label>
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
                    <div style="
                        flex: 1;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        background: #f5f5f5;
                        border: 2px solid #ddd;
                        border-radius: 8px;
                        padding: 8px;
                        min-height: 80px;
                    ">
                        <img id="captchaImage" src="" alt="CAPTCHA 이미지" style="
                            max-width: 100%;
                            height: auto;
                            display: block;
                        ">
                    </div>
                    <button type="button" onclick="refreshCaptcha()" style="
                        padding: 12px 16px;
                        background: #4CAF50;
                        color: white;
                        border: none;
                        border-radius: 8px;
                        cursor: pointer;
                        font-size: 20px;
                    " title="새로고침">🔄</button>
                </div>
                <input type="number" id="captchaAnswer" name="captchaAnswer" class="form-input"
                       placeholder="위 이미지의 답을 입력하세요">
                <input type="hidden" id="captchaId" name="captchaId">
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
                회원가입
            </button>
        </form>

        <div class="auth-links">
            <a href="/static/login.html">이미 계정이 있으신가요? 로그인</a>
        </div>
    </div>

    <!-- ES6 Module: Compatibility Bridge for Auth -->
    <script type="module">
        // Import compatibility bridge (sets up window.Auth)
        import '/static/js/compat/auth-bridge.js';
    </script>
    <script>
        const form = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const emailInput = document.getElementById('email');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        // CAPTCHA 관련 전역 변수
        let currentCaptchaId = null;

        // 이미 로그인된 경우 메인 페이지로 리다이렉트
        if (Auth.isAuthenticated()) {
            window.location.href = '/';
        }

        // CAPTCHA 로드 및 활성화 확인
        async function loadCaptcha() {
            try {
                const captchaData = await Auth.generateCaptcha('register');

                if (captchaData.enabled) {
                    // CAPTCHA 활성화됨
                    currentCaptchaId = captchaData.captcha_id;
                    document.getElementById('captchaImage').src = captchaData.image;
                    document.getElementById('captchaId').value = captchaData.captcha_id;
                    document.getElementById('captchaContainer').style.display = 'block';
                } else {
                    // CAPTCHA 비활성화됨
                    document.getElementById('captchaContainer').style.display = 'none';
                }
            } catch (error) {
                logger.error('CAPTCHA 로드 실패:', error);
                // 에러 시 CAPTCHA 숨김
                document.getElementById('captchaContainer').style.display = 'none';
            }
        }

        // CAPTCHA 새로고침
        async function refreshCaptcha() {
            document.getElementById('captchaAnswer').value = '';
            await loadCaptcha();
        }

        // 페이지 로드 시 CAPTCHA 로드
        document.addEventListener('DOMContentLoaded', () => {
            loadCaptcha();
        });

        // 비밀번호 실시간 검증
        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            const validation = Auth.validatePassword(password);

            // 길이
            updateRequirement('req-length', password.length >= 8);
            // 대문자
            updateRequirement('req-uppercase', /[A-Z]/.test(password));
            // 소문자
            updateRequirement('req-lowercase', /[a-z]/.test(password));
            // 숫자
            updateRequirement('req-digit', /[0-9]/.test(password));
            // 특수문자
            updateRequirement('req-special', /[!@#$%^&*()_+\-=\[\]{}|;:',.<>?/~`]/.test(password));
            // 공백 없음
            updateRequirement('req-nospace', !/\s/.test(password));
        });

        function updateRequirement(id, isValid) {
            const element = document.getElementById(id);
            const text = element.getAttribute('data-text');
            if (isValid) {
                element.className = 'valid';
                element.textContent = '✓ ' + text;
            } else {
                element.className = 'invalid';
                element.textContent = '✗ ' + text;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            Auth.hideError();
            Auth.hideSuccess();

            const email = emailInput.value.trim();
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // 입력값 검증
            if (!email || !username || !password || !confirmPassword) {
                Auth.showError('모든 필드를 입력하세요');
                return;
            }

            if (password !== confirmPassword) {
                Auth.showError('비밀번호가 일치하지 않습니다');
                return;
            }

            // 비밀번호 강도 검증
            const validation = Auth.validatePassword(password);
            if (!validation.valid) {
                Auth.showError('비밀번호가 요구사항을 충족하지 않습니다:\n' + validation.errors.join('\n'));
                return;
            }

            // 사용자명 검증
            if (!/^[a-zA-Z0-9가-힣_]+$/.test(username)) {
                Auth.showError('사용자명은 영문, 숫자, 한글, 언더스코어만 사용할 수 있습니다');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = '가입 처리 중...';

            try {
                // CAPTCHA 정보 가져오기
                let captchaId = null;
                let captchaAnswer = null;

                if (document.getElementById('captchaContainer').style.display !== 'none') {
                    captchaId = document.getElementById('captchaId').value;
                    captchaAnswer = document.getElementById('captchaAnswer').value.trim();

                    if (!captchaAnswer) {
                        Auth.showError('보안 확인 답을 입력하세요');
                        registerBtn.disabled = false;
                        registerBtn.textContent = '회원가입';
                        return;
                    }
                }

                await Auth.register(email, username, password, captchaId, captchaAnswer);

                // 회원가입 성공
                Auth.showSuccess('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다...');

                // 2초 후 로그인 페이지로 이동
                setTimeout(() => {
                    window.location.href = '/static/login.html?message=' +
                        encodeURIComponent('회원가입이 완료되었습니다. 로그인해주세요.');
                }, 2000);

            } catch (error) {
                logger.error('Registration error:', error);
                let errorMessage = error.message;

                // 서버에서 반환한 상세 에러 메시지를 그대로 표시
                if (errorMessage.includes('이미 사용 중')) {
                    Auth.showError('이미 사용 중인 이메일입니다');
                } else if (errorMessage.includes('요청이 너무 많습니다')) {
                    Auth.showError(errorMessage);
                } else if (errorMessage.includes('복잡도') || errorMessage.includes('요구사항')) {
                    // 비밀번호 검증 실패 시 서버의 상세 에러 메시지 표시
                    Auth.showError(errorMessage);
                } else if (errorMessage.includes('사용자명')) {
                    // 사용자명 검증 실패 시 서버의 에러 메시지 표시
                    Auth.showError(errorMessage);
                } else if (errorMessage.includes('CAPTCHA')) {
                    Auth.showError(errorMessage);
                } else {
                    Auth.showError('회원가입에 실패했습니다: ' + errorMessage);
                }

                // 모든 실패 시 CAPTCHA 새로고침 (활성화된 경우에만)
                if (document.getElementById('captchaContainer').style.display !== 'none') {
                    await refreshCaptcha();
                }

                registerBtn.disabled = false;
                registerBtn.textContent = '회원가입';
            }
        });
    </script>
</body>
</html>
