<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - AI 챗봇</title>
    <link rel="stylesheet" href="/static/auth.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- Google reCAPTCHA v3 -->
    <script>
        // reCAPTCHA Site Key를 서버에서 가져옴
        window.RECAPTCHA_SITE_KEY = null;

        // Site Key 로드 함수
        async function loadRecaptchaSiteKey() {
            try {
                // 관리자 API로부터 site key 가져오기 (인증 불필요)
                const response = await fetch('/api/admin/captcha');
                if (response.ok) {
                    const data = await response.json();
                    if (data.site_key && data.site_key !== '설정되지 않음') {
                        window.RECAPTCHA_SITE_KEY = data.site_key;

                        // reCAPTCHA 스크립트 동적 로드
                        const script = document.createElement('script');
                        script.src = `https://www.google.com/recaptcha/api.js?render=${window.RECAPTCHA_SITE_KEY}`;
                        document.head.appendChild(script);
                    }
                }
            } catch (error) {
                console.error('Failed to load reCAPTCHA site key:', error);
            }
        }

        // 페이지 로드 시 site key 로드
        loadRecaptchaSiteKey();
    </script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">🤖</div>
            <h1>회원가입</h1>
            <p>새로운 계정을 만들어 챗봇을 시작하세요</p>
        </div>

        <div id="error-message" class="message error-message"></div>
        <div id="success-message" class="message success-message"></div>

        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label for="email">
                    이메일 <span class="required">*</span>
                </label>
                <input
                    type="email"
                    id="email"
                    class="form-input"
                    placeholder="user@example.com"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="username">
                    사용자명 <span class="required">*</span>
                </label>
                <input
                    type="text"
                    id="username"
                    class="form-input"
                    placeholder="사용자명 (2-50자)"
                    required
                    minlength="2"
                    maxlength="50"
                >
                <small style="color: #666;">영문, 숫자, 한글, 언더스코어(_)만 사용 가능</small>
            </div>

            <div class="form-group">
                <label for="password">
                    비밀번호 <span class="required">*</span>
                </label>
                <input
                    type="password"
                    id="password"
                    class="form-input"
                    placeholder="비밀번호를 입력하세요"
                    required
                >
                <div id="passwordRequirements" class="password-requirements">
                    <strong>비밀번호 요구사항:</strong>
                    <ul>
                        <li id="req-length" class="invalid">✗ 최소 8자 이상</li>
                        <li id="req-uppercase" class="invalid">✗ 대문자 1개 이상</li>
                        <li id="req-lowercase" class="invalid">✗ 소문자 1개 이상</li>
                        <li id="req-digit" class="invalid">✗ 숫자 1개 이상</li>
                        <li id="req-special" class="invalid">✗ 특수문자 1개 이상</li>
                        <li id="req-nospace" class="invalid">✗ 공백 없음</li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    비밀번호 확인 <span class="required">*</span>
                </label>
                <input
                    type="password"
                    id="confirmPassword"
                    class="form-input"
                    placeholder="비밀번호를 다시 입력하세요"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
                회원가입
            </button>
        </form>

        <div class="auth-links">
            <a href="/static/login.html">이미 계정이 있으신가요? 로그인</a>
        </div>
    </div>

    <script src="/static/auth.js"></script>
    <script>
        const form = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const emailInput = document.getElementById('email');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        // 이미 로그인된 경우 메인 페이지로 리다이렉트
        if (Auth.isAuthenticated()) {
            window.location.href = '/';
        }

        // 비밀번호 실시간 검증
        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            const validation = Auth.validatePassword(password);

            // 길이
            updateRequirement('req-length', password.length >= 8);
            // 대문자
            updateRequirement('req-uppercase', /[A-Z]/.test(password));
            // 소문자
            updateRequirement('req-lowercase', /[a-z]/.test(password));
            // 숫자
            updateRequirement('req-digit', /[0-9]/.test(password));
            // 특수문자
            updateRequirement('req-special', /[!@#$%^&*()_+\-=\[\]{}|;:',.<>?/~`]/.test(password));
            // 공백 없음
            updateRequirement('req-nospace', !/\s/.test(password));
        });

        function updateRequirement(id, isValid) {
            const element = document.getElementById(id);
            if (isValid) {
                element.className = 'valid';
                element.textContent = '✓' + element.textContent.substring(1);
            } else {
                element.className = 'invalid';
                element.textContent = '✗' + element.textContent.substring(1);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            Auth.hideError();
            Auth.hideSuccess();

            const email = emailInput.value.trim();
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // 입력값 검증
            if (!email || !username || !password || !confirmPassword) {
                Auth.showError('모든 필드를 입력하세요');
                return;
            }

            if (password !== confirmPassword) {
                Auth.showError('비밀번호가 일치하지 않습니다');
                return;
            }

            // 비밀번호 강도 검증
            const validation = Auth.validatePassword(password);
            if (!validation.valid) {
                Auth.showError('비밀번호가 요구사항을 충족하지 않습니다:\n' + validation.errors.join('\n'));
                return;
            }

            // 사용자명 검증
            if (!/^[a-zA-Z0-9가-힣_]+$/.test(username)) {
                Auth.showError('사용자명은 영문, 숫자, 한글, 언더스코어만 사용할 수 있습니다');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = '가입 처리 중...';

            try {
                // reCAPTCHA 토큰 생성 (활성화된 경우에만)
                let captchaToken = null;
                if (window.RECAPTCHA_SITE_KEY && typeof grecaptcha !== 'undefined') {
                    try {
                        captchaToken = await grecaptcha.execute(window.RECAPTCHA_SITE_KEY, { action: 'register' });
                    } catch (captchaError) {
                        console.error('reCAPTCHA error:', captchaError);
                        // CAPTCHA 실패 시에도 계속 진행 (서버에서 처리)
                    }
                }

                await Auth.register(email, username, password, captchaToken);

                // 회원가입 성공
                Auth.showSuccess('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다...');

                // 2초 후 로그인 페이지로 이동
                setTimeout(() => {
                    window.location.href = '/static/login.html?message=' +
                        encodeURIComponent('회원가입이 완료되었습니다. 로그인해주세요.');
                }, 2000);

            } catch (error) {
                console.error('Registration error:', error);
                let errorMessage = error.message;

                // 서버에서 반환한 상세 에러 메시지를 그대로 표시
                if (errorMessage.includes('이미 사용 중')) {
                    Auth.showError('이미 사용 중인 이메일입니다');
                } else if (errorMessage.includes('요청이 너무 많습니다')) {
                    Auth.showError(errorMessage);
                } else if (errorMessage.includes('복잡도') || errorMessage.includes('요구사항')) {
                    // 비밀번호 검증 실패 시 서버의 상세 에러 메시지 표시
                    Auth.showError(errorMessage);
                } else if (errorMessage.includes('사용자명')) {
                    // 사용자명 검증 실패 시 서버의 에러 메시지 표시
                    Auth.showError(errorMessage);
                } else {
                    Auth.showError('회원가입에 실패했습니다: ' + errorMessage);
                }

                registerBtn.disabled = false;
                registerBtn.textContent = '회원가입';
            }
        });
    </script>
</body>
</html>
