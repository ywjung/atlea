<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 - ATLEA</title>
    <link rel="stylesheet" href="/static/auth.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <meta name="theme-color" content="#7c3aed">

    <!-- Logger System -->
    <script src="/static/env-config.js?v=1"></script>
    <script src="/static/logger.js?v=1"></script>

    <!-- DOMPurify for XSS protection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>

    <!-- Auth utilities -->
    <script src="/static/auth.js?v=1"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo"><img src="/static/favicon.svg" alt="ATLEA" width="64" height="64"></div>
            <h1>비밀번호 재설정</h1>
            <p id="headerText">등록된 이메일 주소를 입력하세요</p>
        </div>

        <div id="error-message" class="message error-message"></div>
        <div id="success-message" class="message success-message"></div>

        <!-- 이메일 입력 폼 -->
        <form id="requestForm" class="auth-form" style="display: block;">
            <div class="form-group">
                <label for="email">
                    이메일 <span class="required">*</span>
                </label>
                <input
                    type="email"
                    id="email"
                    class="form-input"
                    placeholder="user@example.com"
                    required
                    autofocus
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="requestBtn" style="margin-top: 24px;">
                재설정 링크 받기
            </button>
        </form>

        <!-- 토큰 입력 및 비밀번호 재설정 폼 -->
        <form id="resetForm" class="auth-form" style="display: none;">
            <div class="info-message" style="display: block; margin-bottom: 20px;">
                아래에 받으신 재설정 토큰과 새 비밀번호를 입력하세요
            </div>

            <div class="form-group">
                <label for="resetToken">
                    재설정 토큰 <span class="required">*</span>
                </label>
                <textarea
                    id="resetToken"
                    class="form-input"
                    placeholder="재설정 토큰을 입력하세요"
                    rows="4"
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label for="newPassword">
                    새 비밀번호 <span class="required">*</span>
                </label>
                <input
                    type="password"
                    id="newPassword"
                    class="form-input"
                    placeholder="새 비밀번호"
                    required
                >
                <div id="passwordRequirements" class="password-requirements">
                    <strong>비밀번호 요구사항:</strong>
                    <ul>
                        <li id="req-length" class="invalid">✗ 최소 8자 이상</li>
                        <li id="req-uppercase" class="invalid">✗ 대문자 1개 이상</li>
                        <li id="req-lowercase" class="invalid">✗ 소문자 1개 이상</li>
                        <li id="req-digit" class="invalid">✗ 숫자 1개 이상</li>
                        <li id="req-special" class="invalid">✗ 특수문자 1개 이상</li>
                        <li id="req-nospace" class="invalid">✗ 공백 없음</li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    새 비밀번호 확인 <span class="required">*</span>
                </label>
                <input
                    type="password"
                    id="confirmPassword"
                    class="form-input"
                    placeholder="새 비밀번호 다시 입력"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="resetBtn" style="margin-top: 24px;">
                비밀번호 재설정
            </button>

            <button type="button" class="btn btn-secondary btn-block" id="backBtn" style="margin-top: 12px;">
                이메일 다시 입력
            </button>
        </form>

        <div class="auth-links">
            <a href="/static/login.html">로그인 페이지로 돌아가기</a>
            <a href="/static/register.html">계정이 없으신가요? 회원가입</a>
        </div>
    </div>

    <!-- ES6 Module: Compatibility Bridge for Auth -->
    <script type="module">
        // Import compatibility bridge (sets up window.Auth)
        import '/static/js/compat/auth-bridge.js';
    </script>
    <script>
        const requestForm = document.getElementById('requestForm');
        const resetForm = document.getElementById('resetForm');
        const requestBtn = document.getElementById('requestBtn');
        const resetBtn = document.getElementById('resetBtn');
        const backBtn = document.getElementById('backBtn');
        const emailInput = document.getElementById('email');
        const resetTokenInput = document.getElementById('resetToken');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const headerText = document.getElementById('headerText');

        // 재설정 요청
        requestForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            Auth.hideError();
            Auth.hideSuccess();

            const email = emailInput.value.trim();

            if (!email) {
                Auth.showError('이메일을 입력하세요');
                return;
            }

            requestBtn.disabled = true;
            requestBtn.textContent = '요청 중...';

            try {
                const data = await Auth.requestPasswordReset(email);

                // 이메일 발송 여부에 따라 다른 메시지 표시
                if (data.email_sent) {
                    // 이메일로 발송된 경우
                    const message = `✅ 비밀번호 재설정 링크가 이메일로 전송되었습니다.\n\n` +
                        `📧 ${email}로 전송된 이메일을 확인하세요.\n\n` +
                        `⏰ 링크는 1시간 동안 유효합니다.\n\n` +
                        `※ 이메일이 보이지 않으면 스팸 메일함을 확인하세요.`;

                    Auth.showSuccess(message);

                    // 이메일 확인 안내만 표시하고 폼 전환 없음
                    requestBtn.disabled = false;
                    requestBtn.textContent = '재설정 링크 받기';

                } else if (data.reset_token) {
                    // 토큰이 반환된 경우 (SMTP 미설정 또는 이메일 발송 실패)
                    const message = `재설정 토큰이 발급되었습니다.\n\n` +
                        `※ 토큰을 아래 필드에 복사하세요:\n\n` +
                        `토큰: ${data.reset_token}`;

                    Auth.showSuccess(message);

                    // 토큰 자동 입력 (개발 편의)
                    resetTokenInput.value = data.reset_token;

                    // 재설정 폼으로 전환
                    setTimeout(() => {
                        requestForm.style.display = 'none';
                        resetForm.style.display = 'block';
                        headerText.textContent = '새 비밀번호를 설정하세요';
                        Auth.hideSuccess();
                    }, 3000);

                } else {
                    // 예상치 못한 응답
                    throw new Error('응답 형식이 올바르지 않습니다');
                }

            } catch (error) {
                logger.error('Reset request error:', error);
                let errorMessage = error.message;

                if (errorMessage.includes('찾을 수 없습니다')) {
                    Auth.showError('등록되지 않은 이메일입니다');
                } else if (errorMessage.includes('요청이 너무 많습니다')) {
                    Auth.showError(errorMessage);
                } else {
                    Auth.showError('재설정 요청에 실패했습니다: ' + errorMessage);
                }

                requestBtn.disabled = false;
                requestBtn.textContent = '재설정 링크 받기';
            }
        });

        // 비밀번호 실시간 검증
        newPasswordInput.addEventListener('input', () => {
            const password = newPasswordInput.value;
            updateRequirement('req-length', password.length >= 8);
            updateRequirement('req-uppercase', /[A-Z]/.test(password));
            updateRequirement('req-lowercase', /[a-z]/.test(password));
            updateRequirement('req-digit', /[0-9]/.test(password));
            updateRequirement('req-special', /[!@#$%^&*()_+\-=\[\]{}|;:',.<>?/~`]/.test(password));
            updateRequirement('req-nospace', !/\s/.test(password));
        });

        function updateRequirement(id, isValid) {
            const element = document.getElementById(id);
            if (isValid) {
                element.className = 'valid';
                element.textContent = '✓' + element.textContent.substring(1);
            } else {
                element.className = 'invalid';
                element.textContent = '✗' + element.textContent.substring(1);
            }
        }

        // 비밀번호 재설정 확인
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            Auth.hideError();
            Auth.hideSuccess();

            const token = resetTokenInput.value.trim();
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!token) {
                Auth.showError('재설정 토큰을 입력하세요');
                return;
            }

            if (newPassword !== confirmPassword) {
                Auth.showError('새 비밀번호가 일치하지 않습니다');
                return;
            }

            const validation = Auth.validatePassword(newPassword);
            if (!validation.valid) {
                Auth.showError('비밀번호가 요구사항을 충족하지 않습니다');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = '재설정 중...';

            try {
                await Auth.confirmPasswordReset(token, newPassword);

                Auth.showSuccess('비밀번호가 재설정되었습니다! 로그인 페이지로 이동합니다...');

                setTimeout(() => {
                    window.location.href = '/static/login.html?message=' +
                        encodeURIComponent('비밀번호가 재설정되었습니다. 새 비밀번호로 로그인해주세요.');
                }, 2000);

            } catch (error) {
                logger.error('Reset confirm error:', error);
                let errorMessage = error.message;

                if (errorMessage.includes('유효하지 않은 토큰')) {
                    Auth.showError('토큰이 유효하지 않거나 만료되었습니다');
                } else if (errorMessage.includes('복잡도')) {
                    Auth.showError('비밀번호가 복잡도 요구사항을 만족하지 않습니다');
                } else {
                    Auth.showError('비밀번호 재설정에 실패했습니다: ' + errorMessage);
                }

                resetBtn.disabled = false;
                resetBtn.textContent = '비밀번호 재설정';
            }
        });

        // 이메일 다시 입력
        backBtn.addEventListener('click', () => {
            requestForm.style.display = 'block';
            resetForm.style.display = 'none';
            headerText.textContent = '등록된 이메일 주소를 입력하세요';
            resetTokenInput.value = '';
            newPasswordInput.value = '';
            confirmPasswordInput.value = '';
            Auth.hideError();
            Auth.hideSuccess();
        });

        // 페이지 로드 시 URL에서 토큰 확인
        (function initializeFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (token) {
                // URL에 토큰이 있으면 비밀번호 재설정 폼으로 바로 전환
                logger.debug('Token found in URL, switching to reset form');

                // 토큰 입력 필드에 자동 입력
                resetTokenInput.value = token;

                // 폼 전환
                requestForm.style.display = 'none';
                resetForm.style.display = 'block';
                headerText.textContent = '새 비밀번호를 설정하세요';

                // 안내 메시지 표시
                Auth.showSuccess('이메일 링크로 접속하셨습니다. 새 비밀번호를 입력하세요.');
                setTimeout(() => {
                    Auth.hideSuccess();
                }, 3000);
            }
        })();
    </script>
</body>
</html>
