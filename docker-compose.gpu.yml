# Docker Compose for NVIDIA GPU deployment
# Use with: docker-compose -f docker-compose.gpu.yml up -d

services:
  # Nginx reverse proxy with SSL termination
  nginx:
    image: nginx:1.25-alpine
    container_name: chatbot_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - chatbot-network

  # Document Service (Java Spring Boot for multi-format document extraction)
  document-service:
    build:
      context: ./hwp-service
      dockerfile: Dockerfile
    image: chatbot-document-service:latest
    container_name: chatbot_document_service
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2.5G
        reservations:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/document/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - chatbot-network

  # Application server with NVIDIA GPU support
  app:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        APP_USER: appuser
        APP_UID: 1000
        APP_GID: 1000
    image: chatbot-app-gpu:latest
    container_name: chatbot_app_gpu
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DOCUMENT_SERVICE_URL=http://document-service:8081
      - HWP_SERVICE_URL=http://document-service:8081
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      - LLM_MODEL=${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - MODEL_DIR=/app/model
      - DATA_DIR=/app/data
      - CHUNK_SIZE=${CHUNK_SIZE:-512}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-50}
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=${WORKERS:-1}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - app_data:/app/data
      - app_models:/app/model
      - app_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      document-service:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 16G
        reservations:
          cpus: '2'
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Increased for model loading on GPU
    networks:
      - chatbot-network
    runtime: nvidia  # NVIDIA Container Runtime

  # Redis with persistence and authentication
  redis:
    image: redis:7-alpine
    container_name: chatbot_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - redis_logs:/var/log/redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - chatbot-network

  # Redis monitoring (optional, for development/staging)
  redis-insight:
    image: redis/redisinsight:latest
    container_name: chatbot_redis_insight
    ports:
      - "127.0.0.1:8001:5540"
    volumes:
      - redis_insight:/data
    depends_on:
      - redis
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - chatbot-network

  # NVIDIA GPU monitoring (optional)
  nvidia-exporter:
    image: nvidia/dcgm-exporter:latest
    container_name: chatbot_nvidia_exporter
    ports:
      - "127.0.0.1:9400:9400"
    restart: unless-stopped
    profiles:
      - monitoring
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    networks:
      - chatbot-network

  # Prometheus for metrics collection (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: chatbot_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - chatbot-network

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: chatbot_grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - chatbot-network

volumes:
  # Application volumes
  app_data:
    driver: local
  app_models:
    driver: local
  app_logs:
    driver: local

  # Redis volumes
  redis_data:
    driver: local
  redis_logs:
    driver: local
  redis_insight:
    driver: local

  # Nginx volumes
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local

  # Monitoring volumes
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  chatbot-network:
    driver: bridge
