services:
  redis:
    image: redis/redis-stack:latest
    container_name: chatbot_redis
    command: redis-stack-server /redis-stack.conf
    ports:
      - "6379:6379"
      - "8001:8001" # RedisInsight UI
    volumes:
      - redis_data:/data
      - ./redis.conf:/redis-stack.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: document_service
    ports:
      - "8081:8081"  # API port
      - "8082:8082"  # Management/metrics port
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # JVM options are configured in Dockerfile ENTRYPOINT for optimal performance
      # -Xms512m -Xmx2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/document/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  clamav:
    image: clamav/clamav:latest
    platform: linux/amd64  # ARM64 support via x86 emulation (Apple Silicon)
    container_name: chatbot_clamav
    ports:
      - "3310:3310"  # ClamAV daemon port
    volumes:
      - clamav_data:/var/lib/clamav
    environment:
      - CLAMAV_NO_FRESHCLAM=false  # Enable automatic virus definition updates
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "clamdscan --ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s  # ClamAV needs time to load virus definitions (ARM64: 3-5min)

volumes:
  redis_data:
    driver: local
  clamav_data:
    driver: local
