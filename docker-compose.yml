services:
  redis:
    image: redis/redis-stack:latest
    container_name: chatbot_redis
    command: redis-stack-server /redis-stack.conf
    ports:
      - "6379:6379"
      - "8001:8001" # RedisInsight UI
    volumes:
      - redis_data:/data
      - ./redis.conf:/redis-stack.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: document_service
    ports:
      - "8081:8081"  # API port
      - "8082:8082"  # Management/metrics port
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # JVM options are configured in Dockerfile ENTRYPOINT for optimal performance
      # -Xms512m -Xmx2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/document/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

volumes:
  redis_data:
    driver: local
