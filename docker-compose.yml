services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: chatbot_postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      - POSTGRES_DB=chatbot
      - POSTGRES_USER=chatbot_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chatbot_secret}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: document_service
    ports:
      - "8081:8081"  # API port
      - "8082:8082"  # Management/metrics port
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # JVM options are configured in Dockerfile ENTRYPOINT for optimal performance
      # -Xms512m -Xmx2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/document/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  clamav:
    image: clamav/clamav:latest
    platform: linux/amd64  # ARM64 support via x86 emulation (Apple Silicon)
    container_name: chatbot_clamav
    ports:
      - "3310:3310"  # ClamAV daemon port
    volumes:
      - clamav_data:/var/lib/clamav
    environment:
      - CLAMAV_NO_FRESHCLAM=false  # Enable automatic virus definition updates
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "clamdscan --ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s  # ClamAV needs time to load virus definitions (ARM64: 3-5min)

  chatbot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot_app
    ports:
      - "${PORT:-8085}:${PORT:-8085}"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DOCUMENT_SERVICE_URL=http://document-service:8081
      - HWP_SERVICE_URL=http://document-service:8081
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DATABASE_URL=postgresql+asyncpg://chatbot_user:${POSTGRES_PASSWORD:-chatbot_secret}@postgres:5432/chatbot
    volumes:
      - ./data:/app/data
      - ./model:/app/model
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      document-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-8085}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
    driver: local
  clamav_data:
    driver: local
