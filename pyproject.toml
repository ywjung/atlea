[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlea-chatbot"
version = "2.5.1"
description = "ATLEA - Advanced Trusted Learning & Enterprise Assistant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    # ML & AI (torch excluded - platform-specific install required)
    "transformers>=4.45.0",
    "sentence-transformers>=3.2.0",
    "huggingface-hub>=0.26.0",
    "einops>=0.8.0",
    # Text Processing
    "langchain>=0.3.7",
    "langchain-community>=0.3.6",
    # Web Search
    "tavily-python>=0.3.0",
    # Redis
    "redis>=5.0.0",
    "redis-om>=0.2.1",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.1.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    # Logging
    "loguru>=0.7.2",
    # Accelerate
    "accelerate>=0.33.0",
    # Auth & Security
    "python-jose[cryptography]>=3.4.0",
    "passlib[bcrypt]==1.7.4",
    "email-validator==2.1.0",
    "slowapi==0.1.9",
    "Pillow>=10.4.0",
    "pyotp>=2.9.0",
    "qrcode>=7.4.0",
    "ecdsa>=0.19.0",
    "clamd>=1.0.2",
    # Audio
    "pydub>=0.25.0",
]

[project.optional-dependencies]
mac = ["mlx>=0.20.0", "mlx-lm>=0.19.0"]
gpu = ["bitsandbytes>=0.41.0"]
dev = ["pytest-asyncio==0.23.0", "httpx==0.27.0", "ruff"]

[project.scripts]
atlea = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools]
include-package-data = true
